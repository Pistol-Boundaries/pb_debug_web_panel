name: Check and deploy debug panel

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: test-key
      APP_PASSWORD: test-password
      SESSION_SECRET: test-session-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/test_activity_logs.py tests/test_hosting_session.py -q
      - run: bash -n scripts/deploy.sh

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: debug-panel-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployment configuration
        env:
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          test -n "$PROVIDER" && test -n "$SERVICE_ACCOUNT" || {
            echo 'Configure the two GitHub Actions variables described in GITHUB_ACTIONS.md.'
            exit 1
          }
      - uses: google-github-actions/auth@v3
        with:
          project_id: pistol-boundaries-sb
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: npm install --global firebase-tools@15.30.1
      - name: Deploy Cloud Run and Firebase Hosting
        env:
          CLOUDSDK_CORE_DISABLE_PROMPTS: '1'
          CI: 'true'
        run: ./scripts/deploy.sh
